name: Taksh operations
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [deploy-staging, rollback-staging, rollback-production, migrate-staging, migrate-production, restore-staging, usage]
      backup_key:
        description: 'Optional completed daily R2 key for restore; blank uses latest'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: taksh-data-operations
  cancel-in-progress: false
jobs:
  operate:
    if: github.ref == 'refs/heads/main' && vars.TAKSH_DEPLOYMENT_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAKSH_DEPLOYMENT_READY: ${{ vars.TAKSH_DEPLOYMENT_READY }}
      TAKSH_PRODUCTION_READY: ${{ vars.TAKSH_PRODUCTION_READY }}
      WRANGLER_LOG: warn
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build isolated staging
        if: inputs.operation == 'deploy-staging'
        run: npm run build
        env:
          TAKSH_WRANGLER_CONFIG: wrangler.staging.json
      - name: Run trusted operation
        run: node scripts/github-operations.mjs "$TAKSH_OPERATION"
        env:
          TAKSH_OPERATION: ${{ inputs.operation }}
          TAKSH_BACKUP_KEY: ${{ inputs.backup_key }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
