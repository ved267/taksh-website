name: Build isolated branch preview
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: preview-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    if: >-
      vars.TAKSH_CI_READY == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'codex/'))))
    name: Build preview without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Package compiled preview
        run: python3 scripts/package-preview.py
        env:
          TAKSH_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TAKSH_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Upload compiled preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-bundle
          path: .local/preview-bundle.zip
          retention-days: 1
          if-no-files-found: error
