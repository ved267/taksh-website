name: Isolated branch preview
on:
  push:
    branches: ['claude/**', 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  preview:
    if: >-
      vars.TAKSH_CI_READY == 'true' && vars.TAKSH_DEPLOYMENT_READY == 'true' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'codex/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy isolated preview
        id: preview
        run: node scripts/deploy-preview.mjs
        env:
          TAKSH_PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Post URL on the branch pull request
        run: node scripts/comment-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          TAKSH_PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
          TAKSH_PREVIEW_URL: ${{ steps.preview.outputs.url }}
